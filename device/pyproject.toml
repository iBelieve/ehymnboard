[project]
name = "device"
version = "0.1.0"
description = "eHymnBoard device firmware"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "clang-format>=23.1.5",
    "clang-tidy>=23.1.4",
    "gcovr>=8.8",
    "lizard>=1.26.1",
    "pycryptodome>=4.5.0",
    "ruff>=0.17.6",
    "vulture>=2.16",
]

[tool.ruff]
# Third-party submodules
extend-exclude = ["lib"]

[tool.ruff.lint]
# On top of the defaults (E4, E7, E9, F): style, import order, bug-prone
# patterns, security (bandit), complexity, simplifications and pylint.
extend-select = [
    "E",
    "W",
    "I",
    "B",
    "UP",
    "S",
    "C90",
    "SIM",
    "RET",
    "PERF",
    "PL",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.vulture]
paths = ["monitor.py"]
min_confidence = 60
