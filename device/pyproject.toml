[project]
name = "device"
version = "0.1.0"
description = "eHymnBoard device firmware"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "clang-format>=22.1.5",
    "clang-tidy>=22.1.7",
    "pycryptodome>=4.5.0",
    "ruff>=0.15.20",
]

[tool.ruff]
# Third-party submodules
extend-exclude = ["lib"]
