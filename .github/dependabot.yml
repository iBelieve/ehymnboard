# Dependabot covers pnpm (via the npm ecosystem), uv, Docker and GitHub
# Actions. The Pico SDK and Arm toolchain are pinned outside any manifest, so
# .github/workflows/check-pico-sdk.yml opens an issue when a new Pico SDK
# release is out.
version: 2
updates:
  # One entry for the whole pnpm workspace (web/, e2e/, device/emulator/):
  # they share the lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /device
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-firmware
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
