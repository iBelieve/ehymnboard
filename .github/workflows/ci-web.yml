name: CI (web)

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".oxlintrc.base.json"
      - ".prettierrc.json"
      - "tsconfig.base.json"
      - ".prettierignore"
      - ".dockerignore"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".oxlintrc.base.json"
      - ".prettierrc.json"
      - "tsconfig.base.json"
      - ".prettierignore"
      - ".dockerignore"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  # Cancel superseded runs on PR branches only; let every master commit finish
  # so each one keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from the root package.json's packageManager, Node.js
      # from .node-version, and runs pnpm install --frozen-lockfile for the
      # whole workspace.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        if: success() || failure()
        run: pnpm run lint

      - name: Check formatting
        if: success() || failure()
        run: pnpm run format:check

      - name: Test
        if: success() || failure()
        run: pnpm run test

      - name: Build
        if: success() || failure()
        run: pnpm run build

      # The workspace's own files at the root (package.json and the shared
      # configs); each package checks its own.
      - name: Check root formatting
        if: success() || failure()
        working-directory: .
        run: pnpm exec prettier --check .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          # The workspace's lockfile is at the root (see /.dockerignore).
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
