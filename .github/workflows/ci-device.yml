name: CI (device)

on:
  push:
    branches: [master]
    paths:
      - "device/**"
      - "tools/**"
      - ".jscpd.json"
      - ".github/workflows/ci-device.yml"
      - ".github/actions/build-firmware/**"
  pull_request:
    paths:
      - "device/**"
      - "tools/**"
      - ".jscpd.json"
      - ".github/workflows/ci-device.yml"
      - ".github/actions/build-firmware/**"

concurrency:
  group: ci-device-${{ github.ref }}
  # Cancel superseded runs on PR branches only; let every master commit finish
  # so each one keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: device

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' 'test/*.cpp' 'test/*.h' | xargs uv run clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Pins the Pico SDK and Arm toolchain versions.
      - uses: ./.github/actions/build-firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          # The OTA image, its version and the bootloader are for the
          # emulator's OTA tests; ehymnboard_autobahn for the Autobahn job.
          path: |
            device/build/ehymnboard.uf2
            device/build/ehymnboard.elf
            device/build/ehymnboard_autobahn.uf2
            device/build/ehymnboard_autobahn.elf
            device/build/ehymnboard_fota_image_encrypted.bin
            device/build/firmware_version.txt
            device/build/lib/pico_fota_bootloader/pico_fota_bootloader.uf2
          if-no-files-found: error

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Run clang-tidy
        run: |
          TOOLCHAIN_DIR="$(dirname "$(dirname "$(command -v arm-none-eabi-gcc)")")"
          GCC_VER="$(ls "$TOOLCHAIN_DIR/arm-none-eabi/include/c++")"
          uv run clang-tidy -p build --quiet \
            --extra-arg=--target=armv6m-none-eabi \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include/c++/$GCC_VER" \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include/c++/$GCC_VER/arm-none-eabi/thumb/v6-m/nofp" \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include" \
            src/*.cpp

  # Unit and property tests (GoogleTest + RapidCheck) for the
  # hardware-independent code, built for the host under ASan/UBSan with
  # coverage.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S test -B build-test -G Ninja -DSANITIZE=ON -DCOVERAGE=ON

      - name: Build
        run: ninja -C build-test

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

      - name: Check coverage
        run: >
          uv run gcovr --root . --filter 'src/' --object-directory build-test
          --exclude-throw-branches --txt --cobertura build-test/coverage.xml
          --fail-under-line 90

      - name: Check CRAP scores
        run: >
          uv run python ../tools/crap.py --coverage build-test/coverage.xml
          src/board_messages.cpp src/http_headers.cpp src/request_path.cpp
          src/saved_state.cpp src/ws_connection.cpp src/ws_frame.cpp src/ws_handshake.cpp

  # Boots the built firmware in rp2040js with a fake WiFi chip, access point,
  # LAN and server (device/emulator), and runs the scenario tests against it.
  # The emulator itself is TypeScript, type checked and linted by oxlint.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: device/emulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: device/build

      # Installs the pnpm from package.json's packageManager, Node.js from
      # device/emulator/.node-version, and runs pnpm install --frozen-lockfile.
      - id: setup
        uses: pnpm/setup@v3
        with:
          working-directory: device/emulator
          cache: true
          require-lockfile: true

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run lint

      - name: Check formatting
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run format:check

      - name: Run scenario tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm test

  # The firmware's WebSocket client against the Autobahn test suite's
  # fuzzingserver (sections 1-7), running in the emulator as the
  # ehymnboard_autobahn build. See device/emulator/autobahn/README.md.
  autobahn:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: device/emulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: device/build

      - id: setup
        uses: pnpm/setup@v3
        with:
          working-directory: device/emulator
          cache: true
          require-lockfile: true

      - name: Start the fuzzingserver
        run: |
          mkdir -p autobahn/reports
          docker run -d --name autobahn -p 9001:80 \
            -v "$PWD/autobahn/fuzzingserver.json:/config/fuzzingserver.json:ro" \
            -v "$PWD/autobahn/reports:/reports" \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest -m fuzzingserver -s /config/fuzzingserver.json
          # It answers 400 unless the Host header names the port it listens on
          for _ in $(seq 60); do
            curl -fsS -o /dev/null -H "Host: 127.0.0.1:80" http://127.0.0.1:9001/ && exit 0
            sleep 1
          done
          docker logs autobahn
          exit 1

      - name: Run the suite
        run: node autobahn/run.ts

      - name: Upload report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-report
          path: device/emulator/autobahn/reports

  # Complexity and copy-paste limits across the firmware.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check complexity
        run: uv run lizard --CCN 15 --length 150 --arguments 7 --warnings_only src test

      # tools/ holds the CRAP checker (tools/crap.py) the host tests use.
      - name: Check tools complexity
        if: success() || failure()
        run: uv run lizard --CCN 10 --length 80 --arguments 7 --warnings_only ../tools

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check for duplicate code
        if: success() || failure()
        working-directory: .
        run: npx --yes jscpd@5.4.3 device tools

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check . ../tools

      - name: Check formatting
        if: success() || failure()
        run: uv run ruff format --check . ../tools

      - name: Check for dead code
        if: success() || failure()
        run: uv run vulture

      - name: Test the CRAP checker
        if: success() || failure()
        run: uv run pytest -p no:cacheprovider ../tools
