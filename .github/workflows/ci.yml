name: CI

# Every check, on every push to master and every pull request, with no path
# filters: the jobs run in parallel, so running all of them costs little time,
# and every check reports on every commit. The firmware and the server's Docker
# image are each built once and shared, as artifacts, with the jobs that need
# them. The last job, all-green, passes only if every other job passed; it is
# the one required status check, so adding or renaming a job needs no change
# to the branch protection settings. check-pico-sdk.yml is separate: a weekly
# check, not a check of a change.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only; let every master commit finish
  # so each one keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The server the e2e tests run against: its directory (its Dockerfile is
  # there) and its Docker build context. web/ builds from the root, where the
  # pnpm workspace's lockfile is; a server that builds from its own directory
  # sets both to it.
  SERVER_DIR: web
  SERVER_CONTEXT: .
  # The image listens on $PORT. 5000 is what dokku gives it (the fallback
  # server; production is the Cloudflare Worker).
  SERVER_PORT: "5000"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  # Repository-wide checks, run from the root: Prettier over the whole
  # repository (.prettierignore lists what it leaves out), jscpd's copy-paste
  # check over the code (.jscpd.json), and the check that any dependency a
  # change adds or changes is the newest release (latest-or-bust).
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from the root package.json's packageManager and
      # Node.js from .node-version, then only the root's own dev
      # dependencies (Prettier, jscpd, latest-or-bust, and oxlint for the
      # schema that .oxlintrc.base.json points at), not the packages'.
      - uses: pnpm/setup@v3
        with:
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile --filter ehymnboard

      - name: Check formatting
        run: pnpm run format:check

      - name: Check for duplicate code
        if: success() || failure()
        run: pnpm run dupes

      # On a pull request, latest-or-bust compares with its base (fetching
      # that commit into the shallow clone). Other runs, such as pushes to
      # master (already checked as a pull request), and Dependabot's pull
      # requests (its grouped minor-and-patch ones don't move a dependency to
      # a new major version) pass with a note.
      - name: Check that new dependencies are the newest release
        if: success() || failure()
        run: pnpm run check-new-deps

  # Type checks and lints every TypeScript package in the workspace (web/,
  # e2e/, device/emulator/), each with its own tsconfig and .oxlintrc.json.
  # Their tests run in their own jobs below.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from the root package.json's packageManager, Node.js
      # from .node-version, and runs pnpm install --frozen-lockfile for the
      # whole workspace.
      - id: setup
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run lint

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Also runs shellcheck (preinstalled on the runner) over run: steps.
      - name: Install actionlint
        run: bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      - name: Lint workflows
        run: ./actionlint -color

  # --- web/ -----------------------------------------------------------------

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the whole workspace, as the typescript job does
      - id: setup
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm run test

      - name: Build
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run build

  # The server's Docker image, as dokku builds it. The e2e job runs this image.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVER_CONTEXT }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: false
          tags: ehymnboard-server:ci
          outputs: type=docker,dest=${{ runner.temp }}/server-image.tar
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Upload server image
        uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image.tar
          # Long enough to re-run a failed e2e job alone after a weekend.
          retention-days: 7
          if-no-files-found: error

  # --- device/ --------------------------------------------------------------

  device-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' 'test/*.cpp' 'test/*.h' | xargs uv run clang-format --dry-run --Werror

  # The only firmware build: the emulator, Autobahn and e2e jobs use the
  # artifact it uploads.
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Pins the Pico SDK and Arm toolchain versions.
      - uses: ./.github/actions/build-firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          # The OTA image, its version and the bootloader are for the
          # emulator's and e2e's OTA tests; ehymnboard_autobahn for the
          # Autobahn job.
          path: |
            device/build/ehymnboard.uf2
            device/build/ehymnboard.elf
            device/build/ehymnboard_autobahn.uf2
            device/build/ehymnboard_autobahn.elf
            device/build/ehymnboard_fota_image_encrypted.bin
            device/build/firmware_version.txt
            device/build/lib/pico_fota_bootloader/pico_fota_bootloader.uf2
          if-no-files-found: error

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Run clang-tidy
        run: |
          TOOLCHAIN_DIR="$(dirname "$(dirname "$(command -v arm-none-eabi-gcc)")")"
          GCC_VER="$(ls "$TOOLCHAIN_DIR/arm-none-eabi/include/c++")"
          uv run clang-tidy -p build --quiet \
            --extra-arg=--target=armv6m-none-eabi \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include/c++/$GCC_VER" \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include/c++/$GCC_VER/arm-none-eabi/thumb/v6-m/nofp" \
            --extra-arg=-isystem --extra-arg="$TOOLCHAIN_DIR/arm-none-eabi/include" \
            src/*.cpp

  # Unit and property tests (GoogleTest + RapidCheck) for the
  # hardware-independent code, built for the host under ASan/UBSan with
  # coverage.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S test -B build-test -G Ninja -DSANITIZE=ON -DCOVERAGE=ON

      - name: Build
        run: ninja -C build-test

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

      - name: Check coverage
        run: >
          uv run gcovr --root . --filter 'src/' --object-directory build-test
          --exclude-throw-branches --txt --cobertura build-test/coverage.xml
          --fail-under-line 90

      - name: Check CRAP scores
        run: >
          uv run python ../tools/crap.py --coverage build-test/coverage.xml
          src/board_messages.cpp src/http_headers.cpp src/request_path.cpp
          src/saved_state.cpp src/ws_connection.cpp src/ws_frame.cpp src/ws_handshake.cpp

  # Boots the built firmware in rp2040js with a fake WiFi chip, access point,
  # LAN and server (device/emulator), and runs the scenario tests against it.
  # The emulator's type check and lint are in the typescript job.
  emulator:
    needs: firmware
    runs-on: ubuntu-latest
    # Every TLS handshake is a second or so of emulated crypto, which takes
    # longer still to emulate: the suite takes a few minutes
    timeout-minutes: 20
    defaults:
      run:
        working-directory: device/emulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: device/build

      # Installs the whole workspace, as the typescript job does
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Run scenario tests
        run: pnpm test

  # The firmware's WebSocket client against the Autobahn test suite's
  # fuzzingserver (sections 1-7), running in the emulator as the
  # ehymnboard_autobahn build. See device/emulator/autobahn/README.md.
  autobahn:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: device/emulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: device/build

      # Installs the whole workspace, as the typescript job does
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Start the fuzzingserver
        run: |
          mkdir -p autobahn/reports
          docker run -d --name autobahn -p 9001:80 \
            -v "$PWD/autobahn/fuzzingserver.json:/config/fuzzingserver.json:ro" \
            -v "$PWD/autobahn/reports:/reports" \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest -m fuzzingserver -s /config/fuzzingserver.json
          # It answers 400 unless the Host header names the port it listens on
          for _ in $(seq 60); do
            curl -fsS -o /dev/null -H "Host: 127.0.0.1:80" http://127.0.0.1:9001/ && exit 0
            sleep 1
          done
          docker logs autobahn
          exit 1

      - name: Run the suite
        run: node autobahn/run.ts

      - name: Upload report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-report
          path: device/emulator/autobahn/reports

  # Complexity limits across the firmware and tools/ (copy-paste is checked
  # repository-wide in the repo job).
  device-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check complexity
        run: uv run lizard --CCN 15 --length 150 --arguments 7 --warnings_only src test

      # tools/ holds the CRAP checker (tools/crap.py) the host tests use.
      - name: Check tools complexity
        if: success() || failure()
        run: uv run lizard --CCN 10 --length 80 --arguments 7 --warnings_only ../tools

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check . ../tools

      - name: Check formatting
        if: success() || failure()
        run: uv run ruff format --check . ../tools

      - name: Check for dead code
        if: success() || failure()
        run: uv run vulture

      - name: Test the CRAP checker
        if: success() || failure()
        run: uv run pytest -p no:cacheprovider ../tools

  # --- e2e/ -----------------------------------------------------------------

  # Full-stack end-to-end tests (e2e/): the firmware from the firmware job
  # runs in the emulator and talks to the server's Docker image (from the
  # server-image job) over its real HTTP and WebSocket, while Playwright
  # drives the server's admin page. The emulated board's ID is all zeros (its
  # flash has no unique ID), so the server is told to accept it with
  # EXTRA_DEVICE_IDS. To test a replacement server, point SERVER_DIR,
  # SERVER_CONTEXT and SERVER_PORT at it; the tests themselves shouldn't need
  # to change.
  e2e:
    needs: [firmware, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: device/build

      - uses: actions/download-artifact@v8
        with:
          name: server-image
          path: ${{ runner.temp }}

      - name: Start server
        run: |
          docker load --input "$RUNNER_TEMP/server-image.tar"
          docker run -d --name server -p "$SERVER_PORT:$SERVER_PORT" -e PORT="$SERVER_PORT" \
            -e BASIC_AUTH_USERNAME=e2e -e BASIC_AUTH_PASSWORD=e2e-password \
            -e EXTRA_DEVICE_IDS=0000000000000000 \
            ehymnboard-server:ci
          for _ in $(seq 30); do
            curl -fsS "http://localhost:$SERVER_PORT/ok" && exit 0
            sleep 1
          done
          docker logs server
          exit 1

      # Installs the whole workspace, the emulator the tests import included
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:${{ env.SERVER_PORT }}
          E2E_USERNAME: e2e
          E2E_PASSWORD: e2e-password
        run: pnpm test

      - name: Server logs
        if: failure()
        run: docker logs server

      # Traces, serial logs, the board's requests and every frame its panels
      # showed, for each test.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

  # The one required status check: passes only if every job above passed.
  # !cancelled() makes it report even when a job failed, or was skipped
  # because a job it needs failed (a required check that never reports would
  # leave the pull request waiting instead of failing), but not on a run
  # cancelled because a newer push superseded it. Every other job must be listed
  # under needs; the first step fails if one isn't.
  all-green:
    name: All green
    needs:
      - repo
      - typescript
      - actionlint
      - web
      - server-image
      - device-format
      - firmware
      - host-tests
      - emulator
      - autobahn
      - device-quality
      - python
      - e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      # yq is preinstalled on the runner.
      - name: Check every job is listed under needs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          missing="$(comm -23 \
            <(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx all-green | sort) \
            <(jq -r 'keys[]' <<<"$NEEDS" | sort))"
          if [ -n "$missing" ]; then
            echo "::error::Add these jobs to all-green's needs: $missing"
            exit 1
          fi

      - name: Check every job passed
        if: success() || failure()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Jobs that didn't pass:"
            echo "$failed"
            exit 1
          fi
          echo "All jobs passed."
