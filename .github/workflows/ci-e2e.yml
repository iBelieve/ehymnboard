name: CI (e2e)

# Full-stack end-to-end tests (e2e/): the firmware built here runs in the
# emulator and talks to the server's (web/) Docker image over its real HTTP,
# while Playwright drives the server's admin page. To test a replacement
# server, point SERVER_DIR and SERVER_PORT at it and add its directory to the
# paths below; the tests themselves shouldn't need to change.

on:
  push:
    branches: [master]
    paths:
      - "device/**"
      - "web/**"
      - "e2e/**"
      - ".github/actions/build-firmware/**"
      - ".github/workflows/ci-e2e.yml"
  pull_request:
    paths:
      - "device/**"
      - "web/**"
      - "e2e/**"
      - ".github/actions/build-firmware/**"
      - ".github/workflows/ci-e2e.yml"

concurrency:
  group: ci-e2e-${{ github.ref }}
  # Cancel superseded runs on PR branches only; let every master commit finish
  # so each one keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVER_DIR: web
  SERVER_PORT: "5000"

defaults:
  run:
    working-directory: e2e

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/build-firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: e2e-firmware
          path: |
            device/build/ehymnboard.uf2
            device/build/ehymnboard.elf
            device/build/ehymnboard_fota_image_encrypted.bin
            device/build/firmware_version.txt
            device/build/lib/pico_fota_bootloader/pico_fota_bootloader.uf2
          if-no-files-found: error

  # Type checks, lints and formats the tests themselves.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from package.json's packageManager, Node.js from
      # e2e/.node-version, and runs pnpm install --frozen-lockfile.
      - id: setup
        uses: pnpm/setup@v3
        with:
          working-directory: e2e
          cache: true
          require-lockfile: true

      # The tests import the emulator, so its types come from its packages.
      - name: Install emulator dependencies
        run: pnpm --dir ../device/emulator install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run lint

      - name: Check formatting
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm run format:check

  e2e:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: e2e-firmware
          path: device/build

      - uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVER_DIR }}
          push: false
          load: true
          tags: ehymnboard-e2e-server:ci
          cache-from: type=gha,scope=e2e-server
          cache-to: type=gha,mode=max,scope=e2e-server

      - name: Start server
        run: |
          docker run -d --name server -p "$SERVER_PORT:$SERVER_PORT" \
            -e BASIC_AUTH_USERNAME=e2e -e BASIC_AUTH_PASSWORD=e2e-password \
            ehymnboard-e2e-server:ci
          for _ in $(seq 30); do
            curl -fsS "http://localhost:$SERVER_PORT/ok" && exit 0
            sleep 1
          done
          docker logs server
          exit 1

      - id: setup
        uses: pnpm/setup@v3
        with:
          working-directory: e2e
          cache: true
          require-lockfile: true

      - name: Install emulator dependencies
        run: pnpm --dir ../device/emulator install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:${{ env.SERVER_PORT }}
          E2E_USERNAME: e2e
          E2E_PASSWORD: e2e-password
        run: pnpm test

      - name: Server logs
        if: failure()
        run: docker logs server

      # Traces, serial logs, the board's requests and every frame its panels
      # showed, for each test.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
