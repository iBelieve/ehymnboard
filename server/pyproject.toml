[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "str2bool>=1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
